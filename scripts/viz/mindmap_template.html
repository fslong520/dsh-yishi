<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忆时 · 记忆脑图</title>
<style>/*__JSMIND_CSS__*/</style>
<style>
:root{--bg:#0b1220;--text:#e8eef7;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
#hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(11,18,32,.92);
  border-bottom:1px solid #263449;backdrop-filter:blur(8px);flex:0 0 auto;position:relative;z-index:10}
#hdr h1{font-size:17px;font-weight:800;background:linear-gradient(90deg,#2EC4B6,#9B5DE5,#F72585);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#hdr .meta{font-size:12px;color:var(--muted)}
#legend{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:16px;background:#1c2a42;border:1px solid #2a3a52}
.lg i{width:8px;height:8px;border-radius:50%}
#jsmind_container{flex:1 1 auto;position:relative;overflow:hidden}
/* jsMind 深色主题覆写 */
.jsmind{background:transparent !important}
#jsmind_container jmnode{font-family:inherit;font-size:13px}
#jsmind_container jmnode.root-node{font-size:17px;font-weight:800}
/* 悬浮详情 */
#tip{position:fixed;z-index:50;pointer-events:none;display:none;max-width:400px;
  background:#132033;border:1px solid #2EC4B6;border-radius:10px;padding:12px 14px;
  font-size:12px;line-height:1.55;box-shadow:0 10px 34px rgba(0,0,0,.5)}
#tip .th{font-weight:700;margin-bottom:3px;display:flex;gap:6px;align-items:center}
#tip .tm{font-size:11px;color:#8aa0bd;margin-bottom:4px}
#tip .tb{color:#e2e8f0}
/* 控制条 */
#ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;gap:8px;
  background:rgba(19,32,51,.95);border:1px solid #2a3a52;padding:6px 10px;border-radius:12px;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.bt{background:#1c2a42;border:1px solid #2a3a52;color:#e8eef7;padding:5px 13px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .15s;font-family:inherit}
.bt:hover{background:#26395c;border-color:#2EC4B6}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <h1>🎋 忆时 · 记忆脑图</h1>
    <span class="meta" id="meta"></span>
    <div id="legend"></div>
  </div>
  <div id="jsmind_container"></div>
</div>
<div id="tip"><div class="th"></div><div class="tm"></div><div class="tb"></div></div>
<div id="ctl">
  <button class="bt" id="bExpand">全部展开</button>
  <button class="bt" id="bReset">归位</button>
  <button class="bt" id="bCollapse">收起</button>
</div>
<script type="text/javascript">/*__JSMIND_JS__*/</script>
<script type="text/javascript">
var PAYLOAD = /*__MINDMAP_DATA__*/;
var MIND = PAYLOAD.mind;
var NAMES = PAYLOAD.type_names || {};
var COLORS = PAYLOAD.type_colors || {};
var tip = document.getElementById('tip');

var options = {
  container: 'jsmind_container',
  editable: false,
  theme: 'dark',
  support_html: true,
  view: {
    engine: 'canvas',
    hmargin: 120, vmargin: 60,
    line_width: 2, line_color: '#455573', line_style: 'curved',
    node_overflow: 'hidden',
    zoom: {min: 0.3, max: 3, step: 0.1, mask_key: 17}
  },
  layout: {hspace: 34, vspace: 22, pspace: 15, cousin_space: 6}
};

var jm = null;
function initMind(){
  if (jm) { jm.show(MIND); return; }
  jm = new jsMind(options);
  jm.show(MIND);
  // 选择叶子 → 显示详情
  jm.add_event_listener(function(type, data){
    if (type !== 4) return; // 4 = select
    var nodeId = typeof data === 'object' && data.id ? data.id : data;
    try {
      var node = jm.get_node(nodeId);
      if (node && node.data && node.data._date_) {
        showTip(node, event);
      } else {
        tip.style.display = 'none';
      }
    } catch(e){}
  });
}
initMind();

/* 悬停与点击对叶子的详情 */
function showTip(node, e){
  var d = node.data || {};
  var md = d._type_name_ || '';
  tip.querySelector('.th').innerHTML =
    '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(d._color_||'#888')+'"></span>'+(d._date_||'')+' · '+(d._type_emoji_||'')+' '+md;
  var meta=[];
  if (d._keywords_ && d._keywords_.length) meta.push('🏷️ '+d._keywords_.slice(0,5).join('、'));
  if (d._emotion_ != null) meta.push('情绪 '+ (+d._emotion_).toFixed(1));
  if (d._recall_ != null) meta.push('检索 '+d._recall_+'次');
  tip.querySelector('.tm').textContent = meta.join(' · ');
  var body = node.topic || '';
  if (body.length > 600) body = body.slice(0,600)+'…';
  tip.querySelector('.tb').textContent = body;
  tip.style.display = 'block';
  moveTip(e);
}
function moveTip(e){
  var rect = document.getElementById('app').getBoundingClientRect();
  tip.style.left = (e.clientX - rect.left + 14) + 'px';
  tip.style.top = (e.clientY - rect.top + 10) + 'px';
}
window.addEventListener('mousemove', function(e){
  if (tip.style.display === 'block') moveTip(e);
});

/* 控制 */
document.getElementById('bExpand').onclick = function(){ jm.expand_all(); };
document.getElementById('bCollapse').onclick = function(){ jm.expand_to_depth(1); };
document.getElementById('bReset').onclick = function(){ jm.expand_to_depth(1); jm.view.reset(); };

/* 图例与元信息 */
var lg = document.getElementById('legend');
for (var t in COLORS){
  var n = NAMES[t] || t;
  var s = document.createElement('span'); s.className = 'lg';
  s.innerHTML = '<i style="background:'+COLORS[t]+'"></i>'+n; lg.appendChild(s);
}
document.getElementById('meta').textContent = '共 '+PAYLOAD.total+' 条记忆 · 导出 '+(PAYLOAD.export_date||'')+' · 点节点展开，悬停叶看详情';
</script>
</body>
</html>
