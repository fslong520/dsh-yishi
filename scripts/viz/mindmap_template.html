<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忆时 · 记忆脑图</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#2EC4B6; --accent2:#9B5DE5;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%,#1e3a5f 0%,transparent 60%),
             radial-gradient(1000px 700px at 110% 110%,#3b1e5f 0%,transparent 55%),
             var(--bg);
  color:var(--text); overflow:hidden;
}
#app{height:100vh;display:flex;flex-direction:column}
/* 顶栏 */
#hdr{
  display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:rgba(15,23,42,.85);border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);flex:0 0 auto;
}
.logo{font-size:22px}
#hdr h1{
  font-size:17px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
#hdr .meta{font-size:12px;color:var(--muted)}
#legend{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text);background:rgba(51,65,85,.4);padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* 主体 */
#main{flex:1 1 auto;overflow:auto;padding:26px 30px 40px;position:relative}
#guide{
  position:sticky;top:0;z-index:5;font-size:11px;color:var(--muted);
  background:linear-gradient(180deg,var(--bg) 60%,transparent);
  padding:0 0 8px;
}
/* 树 */
ul.tree,ul.tree ul{list-style:none;padding-left:34px;margin:0}
ul.tree>li{margin:2px 0}
li.t-n{position:relative}
/* 引导线（左） */
li.t-n::before{
  content:"";position:absolute;left:-20px;top:-12px;bottom:0;width:22px;
  border-left:1.5px solid var(--border);border-bottom:1.5px solid var(--border);
  border-radius:0 0 0 6px;
}
li.t-n:last-child::after{
  content:"";position:absolute;left:-20px;top:-12px;bottom:50%;
  border-left:1.5px solid var(--border);
}
/* 节点行 */
.nrow{
  display:flex;align-items:center;gap:9px;min-height:32px;
  padding:4px 12px 4px 8px;border-radius:10px;cursor:pointer;
  transition:background .15s,transform .1s;position:relative;
}
.nrow:hover{background:rgba(51,65,85,.5);transform:translateX(2px)}
.nrow.collapsed .caret{transform:rotate(-90deg)}
.caret{
  width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;transition:transform .2s;user-select:none;
}
.caret.hidden{visibility:hidden}
.ndot{width:13px;height:13px;border-radius:50%;flex:0 0 13px;box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.ndot.root{width:20px;height:20px;background:conic-gradient(var(--accent),var(--accent2),var(--accent));box-shadow:0 0 14px rgba(46,196,182,.4)}
.nname{font-size:14px;font-weight:500;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.type>.nrow .nname{font-size:14px;font-weight:600}
li.topic>.nrow .nname{font-size:13px;color:#fbbf24;font-weight:500}
li.mem>.nrow .nname{font-size:12px;color:var(--text);font-weight:400}
.ncount{
  font-size:11px;color:var(--muted);background:rgba(51,65,85,.45);
  padding:1px 8px;border-radius:12px;flex:0 0 auto;min-width:24px;text-align:center;
}
.ntype{font-size:10px;color:var(--muted);flex:0 0 auto;margin-right:2px}
/* 摘要卡（悬停显示全文提示） */
.mem .nname .sum{color:var(--muted);font-size:11px;margin-left:8px}
/* 记忆叶子行 */
li.mem>.nrow{
  min-height:26px;padding:2px 12px 2px 8px;border-left:3px solid transparent;
}
li.mem>.nrow:hover{border-left-color:var(--accent)}
/* 底部说明 */
#foot{flex:0 0 auto;padding:10px 22px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:rgba(15,23,42,.6)}
#foot b{color:var(--accent)}
/* toast */
#toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,41,59,.98);border:1px solid var(--accent);color:var(--text);
  padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transition:all .3s;z-index:50;pointer-events:none;max-width:70%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <span class="logo">🎋</span>
    <h1>忆时 · 记忆脑图</h1>
    <span class="meta" id="meta"></span>
    <div id="legend"></div>
  </div>
  <div id="main">
    <div id="guide">▸ 点击节点展开/收起，逐层下钻。先览概貌，再探细节——全文请至尾部提示用「/忆时 查找」检索。</div>
    <div id="tree"></div>
  </div>
  <div id="foot"></div>
  <div id="toast"></div>
</div>
<script>
var DATA = /*__MINDMAP_DATA__*/;
var COLORS = (DATA && DATA.type_colors) || {};
var NAMES  = (DATA && DATA.type_names)  || {};
var EMOJIS = (DATA && DATA.type_emojis) || {};

// 一次性构建树 DOM
var treeEl = document.getElementById('tree');

function buildTree(node, collapsedAll) {
  var el = document.createElement('li');
  el.className = 't-n ' + (node.type || '');
  var hasKids = node.children && node.children.length > 0;
  var collapsed = collapsedAll ? true : (node._collapsed === true);

  var row = document.createElement('div');
  row.className = 'nrow' + (collapsed ? ' collapsed' : '');

  // caret
  var caret = document.createElement('span');
  caret.className = 'caret' + (hasKids ? '' : ' hidden');
  caret.innerHTML = '▾';
  row.appendChild(caret);

  // dot
  var dot = document.createElement('span');
  dot.className = 'ndot' + (node.type === 'root' ? ' root' : '');
  dot.style.background = node.color || '#555';
  row.appendChild(dot);

  // name
  var name = document.createElement('span');
  name.className = 'nname';
  var txt = node.name || '';
  if (node.type === 'memory') {
    name.innerHTML = '<span class="sum">' + esc(txt) + '</span>';
  } else {
    name.textContent = txt;
  }
  row.appendChild(name);

  // count
  if (hasKids) {
    var cnt = document.createElement('span');
    cnt.className = 'ncount';
    cnt.textContent = node.count || '';
    row.appendChild(cnt);
  }

  el.appendChild(row);

  // children
  if (hasKids) {
    var ul = document.createElement('ul');
    if (collapsed) ul.style.display = 'none';
    var kids = node.children;
    // 分类排序：有子节点在前
    kids = kids.slice().sort(function(a,b){ return (b.children&&b.children.length?1:0) - (a.children&&a.children.length?1:0); });
    for (var i=0;i<kids.length;i++){
      ul.appendChild(buildTree(kids[i], collapsedAll));
    }
    el.appendChild(ul);
  }

  // click
  row.addEventListener('click', function(ev){
    ev.stopPropagation();
    if (!hasKids) {
      showDetail(node, ev);
      return;
    }
    row.classList.toggle('collapsed');
    var list = el.querySelector(':scope > ul');
    if (list) {
      var showing = list.style.display !== 'none';
      list.style.display = showing ? 'none' : 'block';
    }
  });
  return el;
}

function showDetail(node, ev) {
  // 记忆叶子：只有摘要，全文经检索取
  var meta = [];
  if (node.date) meta.push(node.date);
  if (node.type_name) meta.push((node.type_emoji||'') + ' ' + node.type_name);
  if (node.keywords && node.keywords.length) meta.push('🏷️ ' + node.keywords.slice(0,4).join('、'));
  if (node.emotion != null) meta.push('情绪 ' + (+node.emotion).toFixed(1));
  if (node.recall != null) meta.push('检索 ' + node.recall + ' 次');
  toast('📍 ' + node.name + '\n' + (meta.join(' · ') || '') + '\n\n全文请用 「/忆时 查找」 检索该条记忆。', true);
}

function toast(msg, sticky){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, sticky ? 3200 : 900);
}

function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// 初始默认：只展开 root 一层（显示类型总览），类型/主题皆收起（渐进披露）
function expandDefault(node){
  if (node.children) node.children.forEach(function(c){
    c._collapsed = true; // 类型收起 → 主题隐藏
    if (c.children) c.children.forEach(function(g){ g._collapsed = true; }); // 主题收起 → 记忆隐藏
  });
}
if (DATA.tree){ DATA.tree._collapsed = false; expandDefault(DATA.tree); }
treeEl.appendChild(buildTree(DATA.tree, false));

// 元信息
document.getElementById('meta').textContent = '共 ' + (DATA.total||0) + ' 条记忆 · 导出 ' + (DATA.export_date||'')
  + ' · 脑图仅载摘要，全文走检索';
// 图例
var lgEl = document.getElementById('legend');
for (var t in COLORS){
  var n = NAMES[t] || t;
  var s = document.createElement('span');
  s.className='lg';
  s.innerHTML = '<i style="background:'+COLORS[t]+'"></i>' + n;
  lgEl.appendChild(s);
}
// 底部
document.getElementById('foot').innerHTML =
  '💡 <b>脑图为记忆索引</b>——只含类型/主题/摘要，省 token。想看某条全文：<b>/忆时 查找 &lt;关键词&gt;</b> 检索最相关的记忆。'
  + ' 共 ' + (DATA.total||0) + ' 条 · 逐层展开。';
</script>
</body>
</html>
